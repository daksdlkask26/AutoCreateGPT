<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Auto Payment Filler</title>
    <style>
      body {
        width: 300px;
        padding: 15px;
        font-family: Arial, sans-serif;
      }
      h3 {
        margin-top: 0;
        color: #333;
      }
      .profile-info {
        background: #f5f5f5;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      .profile-info p {
        margin: 5px 0;
        font-size: 13px;
      }
      .profile-info strong {
        color: #555;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 10px;
      }
      button:hover {
        background: #45a049;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .status {
        text-align: center;
        padding: 10px;
        border-radius: 5px;
        margin-top: 10px;
        display: none;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
        display: block;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
        display: block;
      }
    </style>
  </head>
  <body>
    <h3>🔐 Auto Payment Filler</h3>

    <div class="profile-info">
      <p><strong>Tên:</strong> <span id="profileName">정민규</span></p>
      <p>
        <strong>Địa chỉ:</strong>
        <span id="profileAddress">17 Garosu-gil, Gangnam-gu</span>
      </p>
      <p>
        <strong>Thành phố:</strong> <span id="profileCity">Seoul, 06035</span>
      </p>
      <p>
        <strong>Quốc gia:</strong> <span id="profileCountry">South Korea</span>
      </p>
      <p>
        <strong>Thẻ:</strong> **** **** **** <span id="profileCard">9324</span>
      </p>
    </div>

    <button id="fillButton">Fill Payment Form</button>

    <div id="status" class="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
